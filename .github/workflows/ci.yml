name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build & Vet
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: go vet
        run: go vet ./...

      - name: go build
        run: CGO_ENABLED=0 go build -o /dev/null ./...
